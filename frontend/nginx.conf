# Serves the built app and forwards /api to the backend, so the browser only talks to one origin.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # Docker's DNS: look the API up again every few seconds instead of only at startup, so a
    # recreated API container (with a new address) is found without restarting nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8080;

    location /api/ {
        # A variable makes nginx resolve the name per request; the request URI is passed as is.
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    # Client-side routes like /competitors/acme-crm are all served by index.html.
    location / {
        try_files $uri /index.html;
    }
}
