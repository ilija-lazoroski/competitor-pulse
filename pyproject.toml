[project]
authors = [{name = "Ilija Lazoroski", email="ilijalazoroski@gmail.com"}]
classifiers=[
    "Programming Language :: Python :: 3.14"
]
dependencies = [
    "monkey-service-kit[api] (>=2.6.0,<3.0.0)",
    "fastapi (>=0.115.6,<1.0.0)",
    "pydantic (>=2.11,<3.0)",
    "pydantic-settings (>=2.7,<3.0)",
    "sqlalchemy[asyncio] (>=2.1,<3.0)",
    "psycopg[binary] (>=3.3,<4.0)",
    "psycopg-pool (>=3.3,<4.0)",
    "alembic (>=1.20,<2.0)",
]
description = "System for tracking competitor product listings over time."
dynamic = ["readme"]
name = "competitor-pulse"
requires-python = ">=3.14, <4.0"
version = "v0.1.0"

[project.scripts]
competitor_pulse = "competitor_pulse.app.main:main"

[tool.setuptools.dynamic]
readme = {file = ["README.md"]}

[project.urls]
Repository = "https://github.com/ilija-lazoroski/competitor-pulse"

[tool.alembic]
script_location = "%(here)s/migrations"
# Date first, so revision files sort in the order they were created.
file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s"

[[tool.alembic.post_write_hooks]]
name = "isort"
type = "console_scripts"
entrypoint = "isort"
options = "REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "black"
type = "console_scripts"
entrypoint = "black"
options = "REVISION_SCRIPT_FILENAME"

[tool.black]
line-length = 100
# Provided by the assignment: never reformat.
extend-exclude = "^/assets/"

[tool.cruft]
skip = [
    "competitor_pulse/__init__.py",
    "README.md",
    "CHANGELOG.md",
    "vulture_allowlist.py"
]

[tool.isort]
known_first_party = "competitor_pulse"
line_length = 100
skip_glob=["**/__init__.py", "assets/*"]
### for compatibility with black
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
log_cli = 1
log_cli_level = "DEBUG"
log_cli_format = "%(asctime)s [%(levelname)s] %(module)s.%(funcName)s.%(lineno)d: %(message)s"
log_cli_date_format = "%H:%M:%S"
addopts = "-v --capture=sys tests"

[tool.vulture]
exclude=[]
paths = ["competitor_pulse", "vulture_allowlist.py"]

[tool.poetry]
include = ["CHANGELOG.md", "README.md"]

[tool.poetry.group.dev.dependencies]
black = "25.12.0"
dlint = "0.15.0"
flake8 = "7.3.0"
isort = "7.0.0"
mypy = "1.19.0"
pudb = ">=2025.1.5"
pynvim = ">=0.4.3, <1.0.0"
pytest = ">=7.1.0, <8.0.0"
pytest-cov = ">=3.0.0, <4.0.0"
pytest-xdist = ">=3.3.1"
vulture = "2.13"
httpx2 = "^2.16"
flake8-tidy-imports = "4.12.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
